<!doctype html>
<meta charset="utf-8" />
<style>
  body { width: 260px; font: 13px system-ui, sans-serif; margin: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 13px; margin: 14px 0 6px; }
  label { display: block; margin: 6px 0; }
  input[type='number'], input[type='text'] { width: 100%; box-sizing: border-box; padding: 4px; }
  #status, #msg { color: #555; }
  button { margin-top: 8px; width: 100%; padding: 6px; }
</style>
<h1>ClearFare</h1>
<div id="status">서버 확인 중…</div>

<h2>내 조건</h2>
<label><input type="checkbox" id="baggage" /> 위탁수하물 필요</label>
<label><input type="checkbox" id="card" /> 카드로 결제</label>

<h2>실제 결제 금액 신고</h2>
<form id="report">
  <label>판매처 <input type="text" id="seller" required maxlength="50" /></label>
  <label>스카이스캐너 표시가(원) <input type="number" id="displayed" required min="1" /></label>
  <label>실제 결제 금액(원) <input type="number" id="final" required min="1" /></label>
  <label><input type="checkbox" id="r-baggage" /> 수하물 추가해서 결제함</label>
  <label><input type="checkbox" id="r-card" /> 카드로 결제함</label>
  <button>신고하기</button>
  <div id="msg"></div>
</form>
<script src="popup.js"></script>
